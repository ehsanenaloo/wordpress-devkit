<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">WordPress DevKit</title>
  <desc id="description">Evidence-based WordPress engineering skills for Claude Code, ChatGPT, Codex and Google Antigravity. Twenty specialist skills and forty-one commands.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c35"/><stop offset="1" stop-color="#194b43"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b2d3c5" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="80" y="80" width="56" height="56" rx="14" fill="#b5dcc1"/>
    <text x="108" y="118" text-anchor="middle" font-size="32" font-weight="700" fill="#12372f">W</text>
    <text x="156" y="116" font-size="20" font-weight="600" letter-spacing="4" fill="#b5dcc1">WORDPRESS ENGINEERING</text>
    <text x="80" y="268" font-size="104" font-weight="750" letter-spacing="-4" fill="#ffffff">WordPress DevKit</text>
    <text x="84" y="338" font-size="34" fill="#d6e6df">Evidence-based skills for AI coding agents.</text>
    <text x="84" y="390" font-size="26" fill="#9fc3b2">No finding without a traced path. No pass without a check that ran.</text>
    <rect x="84" y="462" width="262" height="52" rx="9" fill="#ffffff" fill-opacity=".08" stroke="#83af9b" stroke-opacity=".4"/>
    <text x="215" y="496" text-anchor="middle" font-size="22" fill="#e7f3ec">20 specialist skills</text>
    <rect x="364" y="462" width="262" height="52" rx="9" fill="#ffffff" fill-opacity=".08" stroke="#83af9b" stroke-opacity=".4"/>
    <text x="495" y="496" text-anchor="middle" font-size="22" fill="#e7f3ec">41 Claude commands</text>
    <rect x="644" y="462" width="552" height="52" rx="9" fill="#ffffff" fill-opacity=".08" stroke="#83af9b" stroke-opacity=".4"/>
    <text x="920" y="496" text-anchor="middle" font-size="22" fill="#e7f3ec">Claude · ChatGPT · Codex · Antigravity</text>
    <text x="84" y="590" font-size="20" fill="#7faa96">github.com/ehsanenaloo/wordpress-devkit · MIT</text>
  </g>
</svg>
