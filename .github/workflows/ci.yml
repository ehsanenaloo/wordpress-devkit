name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Validate the product tree
        run: python scripts/package_product.py --check

      - name: Check skill structure and examples
        run: python tests/test_skill_content.py

      - name: Install every skill into a scratch directory
        shell: bash
        run: |
          python scripts/install.py --agent claude --destination "$RUNNER_TEMP/skills"
          python scripts/install.py --agent claude --destination "$RUNNER_TEMP/skills" --status
          test "$(ls "$RUNNER_TEMP/skills" | grep -c '^wp-devkit-')" -eq "$(ls src/skills | wc -l)"

      - name: Replace an installed skill that contains a read-only file
        shell: bash
        run: |
          python -c "import os, stat, sys; os.chmod(sys.argv[1], stat.S_IREAD)" "$RUNNER_TEMP/skills/wp-devkit-ui-design/SKILL.md"
          python scripts/install.py --agent claude --destination "$RUNNER_TEMP/skills" --replace
          python scripts/install.py --agent claude --destination "$RUNNER_TEMP/skills" --status

      - name: Preview and check status through the PowerShell wrapper
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Agent claude -Destination "$env:RUNNER_TEMP/skills/" -Skill 'wp-devkit-ui-design,wp-devkit-wcag-review' -Preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install.ps1 -Agent claude -Destination "$env:RUNNER_TEMP/skills" -Status
          exit $LASTEXITCODE

      - name: Run the doctor entrypoints
        run: |
          python scripts/doctor.py --help
          python scripts/report.py --help

      - name: Build the release archives
        run: |
          python scripts/package_product.py --output build/wp-devkit-ci.zip
          python scripts/package_product.py --agent antigravity --output build/wp-devkit-antigravity-ci.zip

  php-examples:
    name: PHP example syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Lint complete PHP examples in the skills
        run: python tests/test_skill_content.py -k php
