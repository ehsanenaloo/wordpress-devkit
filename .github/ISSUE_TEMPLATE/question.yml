name: Question
description: Ask how to use WordPress DevKit.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [guides](https://ehsanenaloo.github.io/wordpress-devkit/) first. They cover installation, the first review, doctor reports and every skill.
  - type: textarea
    id: question
    attributes:
      label: What do you want to do, and what did you try?
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Client and version
      placeholder: "Claude Code, DevKit 2.0.0"
