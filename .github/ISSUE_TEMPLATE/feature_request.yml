name: Feature request
description: Suggest a new skill, command, check or integration.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        DevKit stays evidence-based, review-safe and free of hidden services. Ideas that need network calls, remote execution or implicit write access need extra discussion. Describe the problem first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation and what is hard today, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New skill
        - Improve an existing skill
        - New or changed command
        - Installer, doctor or reports
        - Another agent client
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this request.
          required: true
